name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange files
        run: |
          mkdir -p www/icons assets
          cp index.html styles.css app.js data.js manifest.json service-worker.js www/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png logo-mark.png logo-full.png www/icons/
          cp asset-icon-only.png assets/icon-only.png
          cp asset-icon-foreground.png assets/icon-foreground.png
          cp asset-icon-background.png assets/icon-background.png
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#18a77f' --iconBackgroundColorDark '#18a77f'
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: notbokheh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
